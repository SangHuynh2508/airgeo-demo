[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "airgeo"
version = "0.2.0"
description = "Bang ve hinh hoc khong cham bang cu chi tay (MediaPipe + OpenCV)"
requires-python = ">=3.10,<3.13"
license = "MIT"
dependencies = [
    "mediapipe==0.10.21",
    "opencv-contrib-python==4.11.0.86",
    "numpy==1.26.4",
    "OneEuroFilter==0.2.1",
    "pillow==13.0.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[project.scripts]
airgeo = "airgeo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
